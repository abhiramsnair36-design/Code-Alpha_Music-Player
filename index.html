<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Musify — A fast, accessible music player built with HTML, CSS and vanilla JavaScript.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#020204">
  <title>Musify</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Icon sprite -->
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>
    <symbol id="i-volume-up" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
    <symbol id="i-volume-down" viewBox="0 0 24 24"><path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/></symbol>
    <symbol id="i-volume-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
    <symbol id="i-add" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12.3 2a10 10 0 0 0-1.9 19.8 10 10 0 0 0 11.4-11.4A10 10 0 0 1 12.3 2z"/></symbol>
    <symbol id="i-musify-logo" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.5 3.5" opacity="0.75"/>
      <path d="M11 34V18C11 13.5 13.5 12 16.5 14.8L24 25.5L31.5 14.8C34.5 12 37 13.5 37 18V34" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="29" x2="18" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="24" y1="34" x2="24" y2="20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="30" y1="29" x2="30" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="24" cy="10" r="2.5" fill="currentColor"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    <symbol id="i-musify-logo" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3.5 3.5" opacity="0.75"/>
      <path d="M11 34V18C11 13.5 13.5 12 16.5 14.8L24 25.5L31.5 14.8C34.5 12 37 13.5 37 18V34" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="18" y1="29" x2="18" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="24" y1="34" x2="24" y2="20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="30" y1="29" x2="30" y2="24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="24" cy="10" r="2.5" fill="currentColor"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
  </svg>

  <!-- Aesthetic neon radiant backdrop with deep black mix -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient__radiant"></div>
    <div class="ambient__glow ambient__glow--1"></div>
    <div class="ambient__glow ambient__glow--2"></div>
    <div class="ambient__glow ambient__glow--3"></div>
    <div class="ambient__grooves"></div>
    <div class="ambient__particles">
      <span class="particle particle--1">&#9834;</span>
      <span class="particle particle--2">&#9835;</span>
      <span class="particle particle--3">&#9833;</span>
      <span class="particle particle--4">&#9836;</span>
      <span class="particle particle--5">&#9834;</span>
      <span class="particle particle--6">&#9835;</span>
      <span class="particle particle--7">&#9833;</span>
      <span class="particle particle--8">&#9836;</span>
    </div>
  </div>

  <main class="app">
    <section class="player" aria-label="Musify music player">

      <!-- Now playing -->
      <div class="now">
        <header class="brand">
          <div class="brand__title">
            <span class="brand__logo" aria-hidden="true">
              <svg class="brand__icon"><use href="#i-musify-logo"/></svg>
            </span>
            <span class="brand__name">Musify</span>
          </div>
          <button type="button" class="btn btn--sm" id="theme-toggle" aria-label="Toggle light or dark theme" title="Toggle theme (T)">
            <svg class="icon"><use id="theme-icon" href="#i-sun"/></svg>
          </button>
        </header>

        <div class="art" id="art" aria-hidden="true">
          <svg class="icon art__icon"><use href="#i-musify-logo"/></svg>
        </div>

        <div class="meta">
          <span class="meta__category" id="category-badge">Musify Radio</span>
          <h1 class="meta__title" id="title">Loading…</h1>
          <p class="meta__artist" id="artist">&nbsp;</p>
        </div>

        <canvas class="viz" id="viz" aria-hidden="true"></canvas>

        <div class="progress">
          <span class="time" id="time-current">0:00</span>
          <input class="range range--seek" id="seek" type="range" min="0" max="10000" step="1" value="0"
                 aria-label="Seek" disabled>
          <span class="time time--end" id="time-duration">0:00</span>
        </div>

        <div class="controls">
          <button type="button" class="btn btn--sm" id="shuffle" aria-pressed="false" aria-label="Shuffle">
            <svg class="icon"><use href="#i-shuffle"/></svg>
          </button>
          <button type="button" class="btn" id="prev" aria-label="Previous track">
            <svg class="icon icon--lg"><use href="#i-prev"/></svg>
          </button>
          <button type="button" class="btn btn--play" id="play" aria-label="Play">
            <svg class="icon icon--xl"><use id="play-icon" href="#i-play"/></svg>
          </button>
          <button type="button" class="btn" id="next" aria-label="Next track">
            <svg class="icon icon--lg"><use href="#i-next"/></svg>
          </button>
          <button type="button" class="btn btn--sm" id="repeat" data-mode="off" aria-label="Repeat: off">
            <svg class="icon"><use id="repeat-icon" href="#i-repeat"/></svg>
          </button>
        </div>

        <div class="extras">
          <div class="volume" id="volume-wrap">
            <button type="button" class="btn btn--sm" id="mute" aria-label="Mute (M)" title="Mute (M)">
              <svg class="icon"><use id="mute-icon" href="#i-volume-up"/></svg>
            </button>
            <input class="range range--volume" id="volume" type="range" min="0" max="100" step="1" value="80"
                   aria-label="Volume">
          </div>
          <div class="extras__right">
            <button type="button" class="btn btn--sm" id="download-current" aria-label="Download current track" title="Download track (D)">
              <svg class="icon"><use href="#i-download"/></svg>
            </button>
            <button type="button" class="chip" id="rate" aria-label="Playback speed 1×. Click to change">1×</button>
          </div>
        </div>
      </div>

      <!-- Playlist & Categories -->
      <aside class="queue" aria-label="Music categories and playlist">
        <div class="queue__head">
          <div>
            <h2 class="queue__title">Categories</h2>
            <p class="queue__count" id="count">0 tracks</p>
          </div>
          <button type="button" class="chip chip--accent" id="add-files">
            <svg class="icon icon--sm" aria-hidden="true"><use href="#i-add"/></svg>
            Add files
          </button>
        </div>

        <!-- Category navigation pills -->
        <nav class="categories" id="categories" aria-label="Music categories">
          <button type="button" class="category-pill is-active" data-cat="90s">90's</button>
          <button type="button" class="category-pill" data-cat="recent">Recent Release</button>
          <button type="button" class="category-pill" data-cat="dev">Developer Favourite</button>
          <button type="button" class="category-pill" data-cat="all">All</button>
        </nav>

        <ul class="queue__list" id="playlist"></ul>
        <p class="queue__hint">Tip: select a category or drag your own audio files here.</p>
      </aside>

    </section>

    <p class="shortcuts" aria-label="Keyboard shortcuts">
      <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> seek · <kbd>↑</kbd><kbd>↓</kbd> volume ·
      <kbd>N</kbd> next · <kbd>P</kbd> previous · <kbd>S</kbd> shuffle · <kbd>R</kbd> repeat · <kbd>M</kbd> mute ·
      <kbd>D</kbd> download · <kbd>T</kbd> theme
    </p>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <input type="file" id="file-input" accept="audio/*" multiple hidden>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="dropzone" aria-hidden="true"><p>Drop audio files to add them</p></div>

  <noscript>This player needs JavaScript to work.</noscript>
</body>
</html>
